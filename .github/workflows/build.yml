name: Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Create build directory
        run: mkdir -p build/classes

      - name: Compile Java files
        run: |
          find src/main/java -name "*.java" > sources.txt
          if [ -d "src/main/resources/lib" ]; then
            CP=$(find src/main/resources/lib -name "*.jar" | tr '\n' ':')
            javac -cp "$CP" -d build/classes @sources.txt
          else
            javac -d build/classes @sources.txt
          fi

      - name: Copy resources into build
        run: |
          if [ -d "src/main/resources" ]; then
            cp -r src/main/resources/. build/classes/
          fi

      - name: Create manifest file
        run: |
          {
            echo "Manifest-Version: 1.0"
            echo "Main-Class: org.server.Main"
            echo "Created-By: GitHub Actions OpenJDK ${{ matrix.java }}"
            echo "Build-Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          } > build/MANIFEST.MF

      - name: Create JAR file
        run: |
          cd build/classes
          jar cfm ../server-jdk${{ matrix.java }}.jar ../MANIFEST.MF .

      - name: Get commit short sha
        id: commit_info
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jdk${{ matrix.java }}-${{ steps.commit_info.outputs.sha_short }}
          path: build/server-jdk${{ matrix.java }}.jar
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit info
        id: commit_info
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_OUTPUT
          echo "commit_author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "commit_date=$(git log -1 --pretty=format:'%ci')" >> $GITHUB_OUTPUT

      - name: Generate version tag
        id: version
        run: |
          echo "tag=v$(date +%Y.%m.%d)-build.$(date +%H%M%S)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT

      - name: Download JDK 17 artifact
        uses: actions/download-artifact@v4
        with:
          name: server-jdk17-${{ steps.commit_info.outputs.sha_short }}
          path: artifacts/jdk17

      - name: Download JDK 21 artifact
        uses: actions/download-artifact@v4
        with:
          name: server-jdk21-${{ steps.commit_info.outputs.sha_short }}
          path: artifacts/jdk21

      - name: Prepare release files
        run: |
          cp artifacts/jdk17/server-jdk17.jar artifacts/server-jdk17.jar
          cp artifacts/jdk21/server-jdk21.jar artifacts/server-jdk21.jar
          cp artifacts/jdk21/server-jdk21.jar artifacts/server.jar

      - name: Create Release Notes
        run: |
          cat << EOF > notes.md
          ## Github-actions

          **Build Time:** ${{ steps.version.outputs.date }}
          **Commit:** \`${{ steps.commit_info.outputs.sha_short }}\`

          ### Latest Commit
          - **Message:** ${{ steps.commit_info.outputs.commit_msg }}
          - **Author:** ${{ steps.commit_info.outputs.commit_author }}
          - **Date:** ${{ steps.commit_info.outputs.commit_date }}

          ### Build Artifacts
          - **server.jar** - Main build with OpenJDK 21 (Size: $(du -h artifacts/server.jar | cut -f1))
          - **server-jdk17.jar** - Built with OpenJDK 17 (Size: $(du -h artifacts/server-jdk17.jar | cut -f1))
          - **server-jdk21.jar** - Built with OpenJDK 21 (Size: $(du -h artifacts/server-jdk21.jar | cut -f1))

          *This release was automatically generated by GitHub Actions*
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: notes.md
          files: |
            artifacts/server.jar
            artifacts/server-jdk17.jar
            artifacts/server-jdk21.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}